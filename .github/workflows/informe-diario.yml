name: Informe diario BOCM

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha BOCM (AAAA-MM-DD); vacío = hoy en Madrid'
        required: false
        type: string
      dry_run:
        description: 'Preparar informe sin enviarlo'
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: bocmi-informe-diario
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar y preparar el informe
        id: report
        working-directory: consulta-bocm-gemini-v7
        env:
          BOCM_APP_URL: ${{ vars.BOCM_APP_URL }}
          BOCM_MAIL_FROM: ${{ secrets.BOCM_MAIL_FROM }}
          BOCM_MAIL_TO: ${{ secrets.BOCM_MAIL_TO }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          BOCM_DATE: ${{ inputs.date }}
          BOCM_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/daily-report.js
      - name: Registrar el envío
        if: steps.report.outputs.sent_date != ''
        uses: actions/upload-artifact@v4
        with:
          name: bocmi-report-${{ steps.report.outputs.sent_date }}
          path: consulta-bocm-gemini-v7/.bocmi-sent.txt
          retention-days: 90
