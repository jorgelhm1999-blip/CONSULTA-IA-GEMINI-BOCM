name: Diagnostico programacion Bocmi

on:
  schedule:
    - cron: '50 9 13 10 *' # 13 de octubre, 11:50 de Madrid en 2026
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar disparador
        run: echo "Evento=${{ github.event_name }}; hora UTC=$(date -u +%FT%TZ)"
